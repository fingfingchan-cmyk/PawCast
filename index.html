<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>PawCast</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-slate-50">
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        const Icons = lucide;

        const PawCast = () => {
            const [weather, setWeather] = useState(null);
            const [loading, setLoading] = useState(false);
            const [view, setView] = useState('home');
            const [locationName, setLocationName] = useState("Hong Kong");
            const [searchQuery, setSearchQuery] = useState("");
            const [isSearching, setIsSearching] = useState(false);
            const [unit, setUnit] = useState('C'); 
            const [lastUpdated, setLastUpdated] = useState(null);
            const [coords, setCoords] = useState({ lat: 22.3193, lon: 114.1694 });
            const scrollRef = useRef(null);

            const formatTemp = (tempC) => unit === 'F' ? Math.round((tempC * 9/5) + 32) : Math.round(tempC);

            const calculateSafety = (tempC, humidity, precipProb, weatherCode, isDaylight, windSpeed) => {
                const tempF = (tempC * 9/5) + 32;
                const feelsIndex = Math.round(tempF + (0.55 * (tempF - 58) * (humidity / 100)));
                const isSunny = [0, 1, 2].includes(weatherCode);
                const roadTempC = isDaylight && isSunny ? tempC + 22 : tempC + 3;
                let hazard = "", level = "safe";

                if ([95, 96, 99].includes(weatherCode)) { level = "danger"; hazard = "Thunderstorm"; }
                else if (windSpeed > 45) { level = "danger"; hazard = "Severe Winds"; }
                else if (roadTempC >= 52) { level = "danger"; hazard = "Searing Road"; }
                else if (feelsIndex >= 165) { level = "danger"; hazard = "Extreme Heat"; }
                else if (precipProb > 70) { level = "avoid"; hazard = "Heavy Rain"; }
                else if (roadTempC >= 44) { level = "avoid"; hazard = "Hot Pavement"; }
                else if (feelsIndex >= 152) { level = "avoid"; hazard = "Tropical Heat"; }
                else if (feelsIndex >= 140 || !isDaylight) { level = "caution"; hazard = !isDaylight ? "Night visibility" : "Rising Indices"; }

                const config = {
                    danger: { label: 'Danger', gradient: 'from-rose-500 to-red-600', text: 'text-rose-500', light: 'bg-rose-50', icon: 'XCircle' },
                    avoid: { label: 'Avoid', gradient: 'from-orange-400 to-orange-600', text: 'text-orange-500', light: 'bg-orange-50', icon: 'AlertTriangle' },
                    caution: { label: 'Caution', gradient: 'from-amber-400 to-amber-500', text: 'text-amber-600', light: 'bg-amber-50', icon: 'Info' },
                    safe: { label: 'Ideal', gradient: 'from-emerald-400 to-teal-500', text: 'text-emerald-500', light: 'bg-emerald-50', icon: 'CheckCircle' }
                };
                return { ...config[level], level, hazard, roadTempC, feelsIndex };
            };

            const fetchWeather = async (lat, lon, label) => {
                setLoading(true);
                try {
                    const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m,is_day&hourly=temperature_2m,relative_humidity_2m,precipitation_probability,weather_code,wind_speed_10m,is_day&daily=sunrise,sunset&timezone=auto`);
                    const data = await res.json();
                    const now = new Date();
                    const currentHourStart = new Date(now.setMinutes(0, 0, 0));

                    const hourlyData = data.hourly.time.map((time, i) => {
                        const itemTime = new Date(time);
                        const isDay = data.hourly.is_day[i] === 1;
                        return {
                            time: itemTime.toLocaleTimeString([], { hour: 'numeric', hour12: true }),
                            rawTime: itemTime,
                            isDay,
                            temp: data.hourly.temperature_2m[i],
                            humidity: data.hourly.relative_humidity_2m[i],
                            prob: data.hourly.precipitation_probability[i],
                            code: data.hourly.weather_code[i],
                            safety: calculateSafety(data.hourly.temperature_2m[i], data.hourly.relative_humidity_2m[i], data.hourly.precipitation_probability[i], data.hourly.weather_code[i], isDay, data.hourly.wind_speed_10m[i])
                        };
                    }).filter(item => item.rawTime >= currentHourStart).slice(0, 12);

                    setWeather({
                        temp: data.current.temperature_2m,
                        humidity: data.current.relative_humidity_2m,
                        code: data.current.weather_code,
                        isDay: data.current.is_day === 1,
                        wind: data.current.wind_speed_10m,
                        sunrise: new Date(data.daily.sunrise[0]).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
                        sunset: new Date(data.daily.sunset[0]).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
                        hourly: hourlyData
                    });
                    if (label) setLocationName(label);
                    setCoords({ lat, lon });
                    setLastUpdated(new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }));
                } catch (e) { console.error(e); }
                setLoading(false);
            };

            const handleSearch = async (e) => {
                e.preventDefault();
                if (!searchQuery.trim()) return;
                setLoading(true);
                try {
                    const res = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(searchQuery)}&count=1&language=en&format=json`);
                    const data = await res.json();
                    if (data.results?.[0]) {
                        const r = data.results[0];
                        fetchWeather(r.latitude, r.longitude, `${r.name}, ${r.country}`);
                        setIsSearching(false);
                        setSearchQuery("");
                    }
                } catch (e) { alert("Search error"); }
                setLoading(false);
            };

            useEffect(() => { fetchWeather(coords.lat, coords.lon, locationName); }, []);

            const Icon = ({ name, size = 24, className = "" }) => {
                const LucideIcon = Icons[name];
                return LucideIcon ? <LucideIcon size={size} className={className} /> : null;
            };

            if (loading && !weather) return (
                <div className="flex flex-col items-center justify-center min-h-screen bg-white text-blue-600 font-black">
                    Loading PawCast...
                </div>
            );

            return (
                <div className="max-w-md mx-auto min-h-screen relative bg-white overflow-hidden shadow-2xl flex flex-col">
                    {isSearching && (
                        <div className="absolute inset-0 bg-white/98 z-[60] p-6 backdrop-blur-xl flex flex-col pt-20">
                            <div className="flex justify-between items-center mb-10">
                                <h2 className="text-4xl font-black">Location</h2>
                                <button onClick={() => setIsSearching(false)} className="p-4 bg-slate-100 rounded-3xl"><Icon name="X" /></button>
                            </div>
                            <form onSubmit={handleSearch} className="space-y-6">
                                <input autoFocus type="text" placeholder="Enter City..." className="w-full bg-slate-100 rounded-[2.5rem] py-7 px-8 font-black text-xl outline-none" value={searchQuery} onChange={(e) => setSearchQuery(e.target.value)} />
                                <button type="submit" className="w-full bg-slate-900 text-white py-7 rounded-[2.5rem] font-black text-xl">Search</button>
                            </form>
                        </div>
                    )}

                    <div className="flex-1 overflow-y-auto scrollbar-hide pb-32">
                        <div className="bg-white p-6 pb-12 rounded-b-[4rem] border-b border-slate-100">
                            <div className="flex justify-between items-start mb-6">
                                <div className="space-y-1">
                                    <div className="flex items-center gap-2">
                                        <div className="bg-blue-600 p-2 rounded-xl text-white"><Icon name="PawPrint" /></div>
                                        <h1 className="text-2xl font-black">PawCast</h1>
                                    </div>
                                    <button onClick={() => setIsSearching(true)} className="flex items-center gap-2 bg-slate-50 px-3 py-1 rounded-full text-[10px] font-black text-slate-500 uppercase">
                                        <Icon name="MapPin" size={12} className="text-blue-500" /> {locationName}
                                    </button>
                                </div>
                                <div className="flex bg-slate-100 p-1 rounded-2xl">
                                    {['C', 'F'].map(u => (
                                        <button key={u} onClick={() => setUnit(u)} className={`px-4 py-2 text-xs font-black rounded-xl transition-all ${unit === u ? 'bg-white text-blue-600 shadow-md' : 'text-slate-400'}`}>°{u}</button>
                                    ))}
                                </div>
                            </div>

                            <div className="flex flex-col items-center">
                                <div className="flex items-start mb-4">
                                    <span className="text-[8rem] font-black tracking-tighter leading-none">{formatTemp(weather.temp)}°</span>
                                    <div className="mt-8 ml-2">
                                        <div className="w-14 h-14 bg-white rounded-3xl flex items-center justify-center shadow-xl border border-slate-50">
                                            <Icon name={weather.code >= 60 ? 'CloudRain' : weather.isDay ? 'Sun' : 'Moon'} className={weather.isDay ? 'text-amber-500' : 'text-indigo-400'} size={28} />
                                        </div>
                                    </div>
                                </div>
                                <div className="flex gap-4 mb-8">
                                    <div className="bg-amber-50 px-3 py-1 rounded-full text-[10px] font-black text-amber-800 border border-amber-100 flex items-center gap-1"><Icon name="Sunrise" size={14}/> {weather.sunrise}</div>
                                    <div className="bg-indigo-50 px-3 py-1 rounded-full text-[10px] font-black text-indigo-800 border border-indigo-100 flex items-center gap-1"><Icon name="Sunset" size={14}/> {weather.sunset}</div>
                                </div>
                                <div className="grid grid-cols-2 gap-4 w-full px-2">
                                    <div className="bg-slate-900 text-white p-5 rounded-[2.5rem] shadow-xl text-center">
                                        <p className="text-[10px] font-black uppercase text-blue-400 mb-1">Safety Index</p>
                                        <p className="text-3xl font-black italic">{weather.hourly[0].safety.feelsIndex}</p>
                                    </div>
                                    <div className="bg-white border-2 border-slate-100 p-5 rounded-[2.5rem] text-center">
                                        <p className="text-[10px] font-black uppercase text-slate-400 mb-1">Road Heat</p>
                                        <p className="text-3xl font-black text-slate-800">{formatTemp(weather.hourly[0].safety.roadTempC)}°</p>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div className="mx-6 -mt-8 relative z-20">
                            <div className={`bg-gradient-to-br ${weather.hourly[0].safety.gradient} rounded-[3rem] p-8 shadow-2xl text-white`}>
                                <h2 className="text-[10px] font-black uppercase opacity-70 mb-1">{weather.hourly[0].safety.hazard || "Normal"}</h2>
                                <p className="text-5xl font-black italic uppercase leading-none mb-4">{weather.hourly[0].safety.label}</p>
                                <p className="font-bold opacity-95">Environment is analysed. Indices are within subtropical tolerance.</p>
                            </div>
                        </div>

                        <div className="mt-12 px-6 overflow-x-auto">
                            <h3 className="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-6 ml-2">12h Timeline</h3>
                            <div className="flex gap-4 pb-4">
                                {weather.hourly.map((h, i) => (
                                    <div key={i} className={`min-w-[110px] p-5 rounded-[2.5rem] border flex flex-col items-center shadow-sm ${h.safety.level === 'safe' ? 'bg-emerald-50 border-emerald-100' : 'bg-white border-slate-100'}`}>
                                        <span className="text-[9px] font-black text-slate-400 uppercase mb-4">{h.time}</span>
                                        <Icon name={h.code >= 60 ? 'CloudRain' : h.isDay ? 'Sun' : 'Moon'} size={24} className={h.isDay ? 'text-amber-500' : 'text-indigo-400'} />
                                        <p className="mt-4 text-xl font-black">{formatTemp(h.temp)}°</p>
                                        <p className={`text-[8px] font-black uppercase ${h.safety.text}`}>{h.safety.label}</p>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </div>

                    <div className="fixed bottom-6 left-6 right-6 bg-white/80 backdrop-blur-2xl border border-white/50 px-8 py-5 flex justify-between items-center rounded-[2.5rem] shadow-2xl">
                        <button className="flex flex-col items-center gap-1 text-blue-600"><Icon name="Waves"
