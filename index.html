<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PawCast - Safe Dog Walking</title>
    <!-- Dependencies -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-slate-100">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        // Map Lucide icons to a global object for the standalone version
        const Icons = lucide;

        const PawCast = () => {
            const [weather, setWeather] = useState(null);
            const [loading, setLoading] = useState(false);
            const [view, setView] = useState('home');
            const [locationName, setLocationName] = useState("Hong Kong");
            const [searchQuery, setSearchQuery] = useState("");
            const [isSearching, setIsSearching] = useState(false);
            const [unit, setUnit] = useState('C'); 
            const [lastUpdated, setLastUpdated] = useState(null);
            const [coords, setCoords] = useState({ lat: 22.3193, lon: 114.1694 });

            const formatTemp = (tempC) => {
                if (unit === 'F') return Math.round((tempC * 9/5) + 32);
                return Math.round(tempC);
            };

            const calculateSafety = (tempC, humidity, precipProb, weatherCode, isDaylight, windSpeed) => {
                const tempF = (tempC * 9/5) + 32;
                const feelsLikeIndex = Math.round(tempF + (0.55 * (tempF - 58) * (humidity / 100)));
                const isSunny = [0, 1, 2].includes(weatherCode);
                const roadTempC = isDaylight && isSunny ? tempC + 24 : tempC + 3;

                let hazard = "";
                let level = "safe";

                if ([95, 96, 99].includes(weatherCode)) { level = "danger"; hazard = "Thunderstorm"; }
                else if (windSpeed > 45) { level = "danger"; hazard = "High Winds"; }
                else if (roadTempC >= 52) { level = "danger"; hazard = "Searing Pavement"; }
                else if (feelsLikeIndex >= 165) { level = "danger"; hazard = "Extreme Heat"; }
                else if (precipProb > 70) { level = "avoid"; hazard = "Heavy Rain"; }
                else if (roadTempC >= 44) { level = "avoid"; hazard = "Hot Pavement"; }
                else if (feelsLikeIndex >= 152) { level = "avoid"; hazard = "High Heat Index"; }
                else if (feelsLikeIndex >= 140 || !isDaylight) { level = "caution"; hazard = !isDaylight ? "Check Visibility" : "Rising Index"; }

                const config = {
                    danger: { label: 'Danger', gradient: 'from-rose-500 to-red-600', text: 'text-rose-500', light: 'bg-rose-50', icon: 'XCircle' },
                    avoid: { label: 'Avoid', gradient: 'from-orange-400 to-orange-600', text: 'text-orange-500', light: 'bg-orange-50', icon: 'AlertTriangle' },
                    caution: { label: 'Caution', gradient: 'from-amber-400 to-amber-500', text: 'text-amber-600', light: 'bg-amber-50', icon: 'Info' },
                    safe: { label: 'Ideal', gradient: 'from-emerald-400 to-teal-500', text: 'text-emerald-500', light: 'bg-emerald-50', icon: 'CheckCircle' }
                };

                return { ...config[level], level, hazard, roadTempC, feelsLikeIndex, windSpeed };
            };

            const fetchWeather = async (lat, lon, label) => {
                try {
                    setLoading(true);
                    const response = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m,precipitation,is_day&hourly=temperature_2m,relative_humidity_2m,precipitation_probability,weather_code,wind_speed_10m,is_day&daily=sunrise,sunset&timezone=auto`);
                    const data = await response.json();
                    const now = new Date();
                    const currentHourStart = new Date(now.setMinutes(0, 0, 0));

                    const hourlyData = data.hourly.time.map((time, i) => {
                        const itemTime = new Date(time);
                        const isDay = data.hourly.is_day[i] === 1;
                        return {
                            time: itemTime.toLocaleTimeString([], { hour: 'numeric', hour12: true }),
                            rawTime: itemTime,
                            isDay,
                            temp: data.hourly.temperature_2m[i],
                            humidity: data.hourly.relative_humidity_2m[i],
                            prob: data.hourly.precipitation_probability[i],
                            code: data.hourly.weather_code[i],
                            wind: data.hourly.wind_speed_10m[i],
                            safety: calculateSafety(data.hourly.temperature_2m[i], data.hourly.relative_humidity_2m[i], data.hourly.precipitation_probability[i], data.hourly.weather_code[i], isDay, data.hourly.wind_speed_10m[i])
                        };
                    }).filter(item => item.rawTime >= currentHourStart).slice(0, 12);

                    setWeather({
                        temp: data.current.temperature_2m,
                        humidity: data.current.relative_humidity_2m,
                        code: data.current.weather_code,
                        wind: data.current.wind_speed_10m,
                        isDay: data.current.is_day === 1,
                        sunrise: new Date(data.daily.sunrise[0]).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
                        sunset: new Date(data.daily.sunset[0]).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
                        hourly: hourlyData
                    });
                    if (label) setLocationName(label);
                    setCoords({ lat, lon });
                    setLastUpdated(new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }));
                } catch (err) { console.error(err); }
                finally { setLoading(false); }
            };

            const handleSearch = async (e) => {
                e.preventDefault();
                if (!searchQuery.trim()) return;
                try {
                    setLoading(true);
                    const geoRes = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(searchQuery)}&count=1&language=en&format=json`);
                    const geoData = await geoRes.json();
                    if (geoData.results?.length > 0) {
                        const { latitude, longitude, name, admin1, country } = geoData.results[0];
                        fetchWeather(latitude, longitude, `${name}, ${admin1 || country}`);
                        setIsSearching(false);
                        setSearchQuery("");
                    }
                } catch (err) { alert("Location not found"); }
                finally { setLoading(false); }
            };

            useEffect(() => { fetchWeather(coords.lat, coords.lon, locationName); }, []);

            const Icon = ({ name, ...props }) => {
                const LucideIcon = Icons[name];
                return LucideIcon ? <LucideIcon {...props} /> : null;
            };

            if (loading && !weather) return (
                <div className="flex flex-col items-center justify-center min-h-screen bg-white">
                    <div className="animate-bounce text-blue-600 font-black text-xl">Loading PawCast...</div>
                </div>
            );

            return (
                <div className="max-w-md mx-auto min-h-screen relative bg-white overflow-hidden shadow-2xl flex flex-col border-x border-slate-100">
                    {/* Search UI */}
                    {isSearching && (
                        <div className="absolute inset-0 bg-white/98 z-[60] p-6 backdrop-blur-xl flex flex-col pt-20">
                            <div className="flex justify-between items-center mb-10">
                                <h2 className="text-4xl font-black">Location</h2>
                                <button onClick={() => setIsSearching(false)} className="p-4 bg-slate-100 rounded-3xl"><Icon name="X" /></button>
                            </div>
                            <form onSubmit={handleSearch} className="space-y-6">
                                <input autoFocus type="text" placeholder="Enter City..." className="w-full bg-slate-100 rounded-[2.5rem] py-7 px-8 font-black text-xl outline-none" value={searchQuery} onChange={(e) => setSearchQuery(e.target.value)} />
                                <button type="submit" className="w-full bg-slate-900 text-white py-7 rounded-[2.5rem] font-black text-xl">Change Forecast</button>
                            </form>
                        </div>
                    )}

                    <div className="flex-1 overflow-y-auto scrollbar-hide pb-32">
                        {/* Header */}
                        <div className="bg-white p-6 pb-12 rounded-b-[4rem] border-b border-slate-100 shadow-sm">
                            <div className="flex justify-between items-start mb-8">
                                <div>
                                    <div className="flex items-center gap-2 mb-2">
                                        <div className="bg-blue-600 p-2 rounded-xl text-white"><Icon name="PawPrint" size={24} /></div>
                                        <h1 className="text-2xl font-black">PawCast</h1>
                                    </div>
                                    <button onClick={() => setIsSearching(true)} className="flex items-center gap-2 bg-slate-50 px-3 py-1 rounded-full text-[10px] font-black uppercase text-slate-500">
                                        <Icon name="MapPin" size={12} /> {locationName} <Icon name="ChevronRight" size={12} />
                                    </button>
                                </div>
                                <div className="flex bg-slate-100 p-1 rounded-2xl">
                                    {['C', 'F'].map(u => (
                                        <button key={u} onClick={() => setUnit(u)} className={`px-4 py-2 text-xs font-black rounded-xl transition-all ${unit === u ? 'bg-white text-blue-600 shadow-md' : 'text-slate-400'}`}>°{u}</button>
                                    ))}
                                </div>
                            </div>

                            {/* Main Temp Row - FIXED OVERLAP */}
                            <div className="flex flex-col items-center">
                                <div className="flex items-start mb-6">
                                    <span className="text-[9rem] font-black tracking-tighter leading-none">{formatTemp(weather.temp)}°</span>
                                    <div className="mt-10 ml-2">
                                        <div className="w-16 h-16 bg-white rounded-3xl flex items-center justify-center shadow-xl border border-slate-50">
                                            <Icon name={weather.code >= 60 ? 'CloudRain' : weather.isDay ? 'Sun' : 'Moon'} size={32} className={weather.isDay ? 'text-amber-500' : 'text-indigo-400'} />
                                        </div>
                                    </div>
                                </div>

                                <div className="flex gap-4 mb-8">
                                    <div className="flex items-center gap-2 bg-amber-50 px-4 py-2 rounded-full border border-amber-100 text-[10px] font-black text-amber-800">
                                        <Icon name="Sunrise" size={14} /> {weather.sunrise}
                                    </div>
                                    <div className="flex items-center gap-2 bg-indigo-50 px-4 py-2 rounded-full border border-indigo-100 text-[10px] font-black text-indigo-800">
                                        <Icon name="Sunset" size={14} /> {weather.sunset}
                                    </div>
                                </div>

                                <div className="grid grid-cols-2 gap-4 w-full">
                                    <div className="bg-slate-900 text-white p-6 rounded-[2.5rem] shadow-xl text-center">
                                        <p className="text-[10px] font-black uppercase text-blue-400 mb-1">Safety Index</p>
                                        <p className="text-4xl font-black italic">{weather.hourly[0].safety.feelsLikeIndex}</p>
                                        <div className="w-full h-1 bg-white/10 mt-3 rounded-full overflow-hidden">
                                            <div className="bg-blue-400 h-full w-[40%]"></div>
                                        </div>
                                    </div>
                                    <div className="bg-white border-2 border-slate-100 p-6 rounded-[2.5rem] text-center">
                                        <p className="text-[10px] font-black uppercase text-slate-400 mb-1">Road Heat</p>
                                        <p className="text-4xl font-black">{formatTemp(weather.hourly[0].safety.roadTempC)}°{unit}</p>
                                        <div className="w-full h-1 bg-slate-100 mt-3 rounded-full overflow-hidden">
                                            <div className="bg-orange-400 h-full w-[30%]"></div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        {/* Recommendation */}
                        <div className="mx-6 -mt-8 relative z-20">
                            <div className={`bg-gradient-to-br ${weather.hourly[0].safety.gradient} rounded-[3rem] p-8 shadow-2xl text-white`}>
                                <div className="flex justify-between items-start mb-6">
                                    <div>
                                        <h2 className="text-[10px] font-black uppercase opacity-70 mb-1">{weather.hourly[0].safety.hazard || "All Clear"}</h2>
                                        <p className="text-5xl font-black italic uppercase leading-none">{weather.hourly[0].safety.label}</p>
                                    </div>
                                    <div className="bg-white/20 p-4 rounded-3xl backdrop-blur-xl"><Icon name={weather.hourly[0].safety.icon} size={32} /></div>
                                </div>
                                <p className="font-bold opacity-95">Environmental conditions are stable for a walk. Always monitor for heavy panting.</p>
                            </div>
                        </div>

                        {/* Forecast Scroll */}
                        <div className="mt-12 px-6">
                            <h3 className="text-[10px] font-black text-slate-400 uppercase tracking-[0.2em] mb-6 ml-2">12h Timeline</h3>
                            <div className="flex gap-4 overflow-x-auto pb-6 scrollbar-hide snap-x">
                                {weather.hourly.map((h, i) => (
                                    <div key={i} className={`min-w-[120px] p-6 rounded-[2.5rem] border snap-start flex flex-col items-center ${h.safety.level === 'safe' ? 'bg-emerald-50 border-emerald-100' : 'bg-white border-slate-100'}`}>
                                        <span className="text-[9px] font-black text-slate-400 uppercase mb-4">{h.time}</span>
                                        <Icon name={h.code >= 60 ? 'CloudRain' : h.isDay ? 'Sun' : 'Moon'} size={24} className={h.isDay ? 'text-amber-500' : 'text-indigo-400'} />
                                        <div className="mt-4 mb-4 text-center">
                                            <p className="text-xl font-black leading-none">{formatTemp(h.temp)}°</p>
                                            <p className={`text-[8px] font-black uppercase ${h.safety.text}`}>{h.safety.label}</p>
                                        </div>
                                        <div className="w-full pt-4 border-t border-slate-100 space-y-2">
                                            <div className="flex justify-between text-[9px] font-black"><Icon name="Activity" size={10} className="text-blue-400"/> {h.safety.feelsLikeIndex}</div>
                                            <div className="flex justify-between text-[9px] font-black"><Icon name="Flame" size={10} className="text-orange-400"/> {formatTemp(h.safety.roadTempC)}°</div>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </div>

                    {/* Bottom Nav */}
                    <div className="absolute bottom-6 left-6 right-6 bg-white/80 backdrop-blur-2xl border border-white/50 px-8 py-5 flex justify-between items-center z-40 rounded-[2.5rem] shadow-2xl">
                        <button className="flex flex-col items-center gap-1 text-blue-600"><Icon name="Waves" /><span className="text-[8px] font-black uppercase">Live</span></button>
                        <button onClick={() => setView('details')} className="flex flex-col items-center gap-1 text-slate-400"><Icon name="Activity" /><span className="text-[8px] font-black uppercase">Science</span></button>
                        <button onClick={() => setView('emergency')} className="flex flex-col items-center gap-1 text-rose-500"><Icon name="ShieldAlert" /><span className="text-[8px] font-black uppercase">Urgent</span></button>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<PawCast />);
    </script>
</body>
</html>
